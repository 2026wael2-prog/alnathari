version: '3.8'

services:
  # =================================================================
  # قاعدة بيانات PostgreSQL المشتركة
  # =================================================================
  postgres:
    image: postgres:15-alpine
    container_name: alzhra-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatwoot_production}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - alzhra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =================================================================
  # خادم Redis المشترك لطوابير الرسائل والتخزين المؤقت
  # =================================================================
  redis:
    image: redis:7-alpine
    container_name: alzhra-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ChangeMeRedis123}"]
    volumes:
      - redisdata:/data
    networks:
      - alzhra-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ChangeMeRedis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =================================================================
  # بوابة واتساب Evolution API
  # =================================================================
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: alzhra-evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-alzhra_secret_token_2026}
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ChangeMeSecurePassword123}@postgres:5432/evolution_db?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD:-ChangeMeRedis123}@redis:6379/1
      # تكامل Webhook التلقائي مع نظام الزهراء ERP
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${ALZHRA_ERP_WEBHOOK_URL:-https://your-project.supabase.co/functions/v1/whatsapp-inbound-webhook}
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alzhra-network

  # =================================================================
  # منصة خدمة العملاء Chatwoot Web
  # =================================================================
  chatwoot-web:
    image: chatwoot/chatwoot:v3.15.1
    container_name: alzhra-chatwoot-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY:-b9348c9038294829348290348203948203948209348209348}
      - FRONTEND_URL=${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
      - DEFAULT_LOCALE=ar
      - POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot_production}
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ChangeMeSecurePassword123}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ChangeMeRedis123}@redis:6379/0
      - ACTIVE_STORAGE_SERVICE=local
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    networks:
      - alzhra-network

  # =================================================================
  # عمال معالجة الخلفية Chatwoot Sidekiq
  # =================================================================
  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v3.15.1
    container_name: alzhra-chatwoot-sidekiq
    restart: always
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY:-b9348c9038294829348290348203948203948209348209348}
      - FRONTEND_URL=${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
      - DEFAULT_LOCALE=ar
      - POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot_production}
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ChangeMeSecurePassword123}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ChangeMeRedis123}@redis:6379/0
      - ACTIVE_STORAGE_SERVICE=local
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    networks:
      - alzhra-network

volumes:
  pgdata:
  redisdata:
  evolution_instances:
  chatwoot_storage:

networks:
  alzhra-network:
    driver: bridge
